<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JobPilot Capture</title>
    <style>
      body {
        font: 13px/1.4 system-ui, sans-serif;
        margin: 0;
        padding: 12px;
        width: 340px;
        color: #10233f;
        background: #f7f9fb;
      }
      h1 { font-size: 15px; margin: 0 0 8px; }
      h2 { font-size: 13px; margin: 14px 0 8px; }
      label { display: grid; gap: 4px; margin-bottom: 8px; }
      input, textarea, button { font: inherit; }
      input, textarea {
        padding: 6px 8px;
        border: 1px solid #c9d4e2;
        border-radius: 8px;
      }
      button {
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        background: #0f8b5c;
        color: #fff;
        cursor: pointer;
      }
      button.secondary { background: #dfe7f0; color: #10233f; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      .row { display: flex; gap: 8px; }
      .row button { flex: 1; }
      .status { margin-top: 8px; color: #5b6b7c; }
      .error { color: #b42318; }
      .hint { color: #5b6b7c; font-size: 12px; margin: 0 0 8px; }
    </style>
  </head>
  <body>
    <h1>Capture to JobPilot</h1>
    <label>
      API base
      <input id="apiBase" placeholder="http://localhost:3000" />
    </label>
    <label>
      Extension token
      <input id="token" type="password" placeholder="jpxt_…" autocomplete="off" />
    </label>
    <label>
      Title
      <input id="title" />
    </label>
    <label>
      Company
      <input id="company" />
    </label>
    <label>
      Location
      <input id="location" />
    </label>
    <label>
      Description
      <textarea id="description" rows="4"></textarea>
    </label>
    <div class="row">
      <button id="refresh" class="secondary" type="button">Re-scan page</button>
      <button id="track" type="button">Track</button>
    </div>
    <div class="row" style="margin-top: 8px">
      <button id="prepare" type="button">Assisted Apply</button>
      <button id="save" class="secondary" type="button">Save settings</button>
    </div>

    <h2>Autofill assist</h2>
    <p class="hint">Detects fields and fills from your apply kit only when you click. Never bypasses CAPTCHA or login walls. Sensitive fields stay blank.</p>
    <label>
      Application id
      <input id="applicationId" placeholder="Filled after Assisted Apply" />
    </label>
    <div class="row">
      <button id="detect" class="secondary" type="button">Detect fields</button>
      <button id="fill" type="button">Fill from kit</button>
    </div>
    <div class="row" style="margin-top: 8px">
      <button id="markApplied" class="secondary" type="button">Mark Applied</button>
    </div>
    <p id="status" class="status">Open a job listing, then capture.</p>
    <script src="popup.js"></script>
  </body>
</html>
